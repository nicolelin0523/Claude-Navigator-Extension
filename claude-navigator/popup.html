<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1625;
      color: #e8e4ff;
    }
    h2 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #b09ef0;
    }
    p {
      font-size: 12px;
      color: #a09ab8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(130, 100, 220, 0.25);
      color: #c4b5fd;
      font-size: 11px;
      border: 1px solid rgba(130, 100, 220, 0.4);
    }
  </style>
</head>
<body>
  <h2>🟣 Claude Navigator</h2>
  <p>在 Claude 對話頁面右側顯示圓點，點擊即可跳轉到對應問題。</p>
  <span class="badge">✓ 已在 claude.ai 啟用</span>
</body>
</html>
